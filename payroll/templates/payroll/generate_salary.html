{% extends 'base.html' %}
{# এখন কোনো URL এই টেমপ্লেট ব্যবহার করে না (payroll/urls.py তে generate_salary কমেন্ট করা) #}
{% block title %}Generate Salary{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
  <form method="post" class="card space-y-5 p-6">
    {% csrf_token %}
    <h1 class="text-xl font-bold text-slate-900 dark:text-white">Generate salary for a month</h1>
    <div>
      <label for="gs-month" class="form-label">Month</label>
      <input id="gs-month" type="month" name="month" required class="form-input">
    </div>
    <button type="submit" class="btn-primary w-full">Generate</button>
  </form>
</div>
{% endblock %}
