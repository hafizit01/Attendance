{# ডিজাইন সিস্টেম: Tailwind কনফিগ + কম্পোনেন্ট ক্লাস + থিম। base.html, login.html, 404.html সবাই এটা include করে #}
  {# থিম ও সাইডবারের অবস্থা রেন্ডারের আগেই বসাই, যাতে ঝলক না দেয় #}
  <script>
    (function () {
      try {
        var t = localStorage.theme;
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
        if (localStorage.getItem('sidebarCollapsed') === 'true') document.documentElement.classList.add('sb-collapsed');
      } catch (e) {}
      // স্টাইল (Tailwind) তৈরি হওয়ার আগের মুহূর্তে পেজ লুকানো থাকে — না হলে প্রথমে স্টাইল ছাড়া দেখিয়ে তারপর
      // হঠাৎ বদলে যেত (ঝাঁকি)। স্টাইল বসলে একবারই নরমভাবে দেখায়; কোনো কারণে আটকালেও ১ সেকেন্ডে দেখাবেই।
      var root = document.documentElement;
      root.classList.add('is-loading');
      var shown = false;
      function show() { if (!shown) { shown = true; root.classList.remove('is-loading'); } }
      setTimeout(show, 1000);
      document.addEventListener('DOMContentLoaded', function () {
        var ready = function () { requestAnimationFrame(function () { requestAnimationFrame(show); }); };
        // ফন্ট লোড হওয়ার পরে দেখাই, নইলে লেখা প্রথমে অন্য ফন্টে দেখিয়ে পরে সরে যায় (ক্যাশে থাকলে সাথে সাথেই)
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(ready, ready); else ready();
      });
    })();
  </script>
  <style>
    html.is-loading body { opacity: 0; }
    body { transition: opacity .12s ease-out !important; }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.1"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          // Inter এ বাংলা গ্লিফ নেই — বাংলা লেখা Hind Siliguri তে পড়ে
          fontFamily: { sans: ['Inter', 'Hind Siliguri', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            primary: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' }
          },
          boxShadow: {
            soft: '0 1px 2px 0 rgba(16, 24, 40, 0.04), 0 4px 12px -4px rgba(16, 24, 40, 0.06)',
            lift: '0 18px 40px -16px rgba(30, 27, 75, 0.28)',
            glow: '0 8px 24px -6px rgba(99, 102, 241, 0.55)',
          },
          keyframes: {
            fadeUp: { '0%': { opacity: 0, transform: 'translateY(8px)' }, '100%': { opacity: 1, transform: 'none' } },
            pulseRing: { '0%': { transform: 'scale(.8)', opacity: .7 }, '100%': { transform: 'scale(2.2)', opacity: 0 } },
            shimmer: { '100%': { transform: 'translateX(100%)' } },
          },
          animation: {
            'fade-up': 'fadeUp .45s cubic-bezier(.2,.7,.2,1) both',
            'pulse-ring': 'pulseRing 1.6s cubic-bezier(.2,.7,.2,1) infinite',
          }
        }
      }
    }
  </script>

  {# ডিজাইন সিস্টেম: সব পেজ এই কম্পোনেন্ট ক্লাসগুলো ব্যবহার করে #}
  <style type="text/tailwindcss">
    @layer base {

    @layer components {
      /* কার্ড — নরম কাচের মতো সাদা, হালকা ছায়া */
      .card { @apply rounded-2xl border border-slate-200/80 bg-white shadow-[0_1px_2px_rgba(15,23,42,.04),0_8px_24px_-12px_rgba(15,23,42,.08)] transition-all duration-300 ease-in-out dark:border-white/[0.06] dark:bg-slate-900/80; }
      .card-hover { @apply hover:-translate-y-0.5 hover:border-primary-200 hover:shadow-lift dark:hover:border-primary-500/30; }
      .card-header { @apply flex items-center justify-between gap-3 border-b border-slate-100 px-5 py-4 dark:border-white/[0.06]; }
      .card-title { @apply flex items-center gap-2 text-[0.95rem] font-semibold text-slate-900 dark:text-white; }

      .text-gradient { @apply bg-gradient-to-r from-primary-600 via-violet-600 to-fuchsia-500 bg-clip-text text-transparent dark:from-primary-300 dark:via-violet-300 dark:to-fuchsia-300; }

      /* হিরো ব্যানার (ড্যাশবোর্ড/বড় পেজের মাথায়) */
      .hero { @apply relative overflow-hidden rounded-3xl bg-gradient-to-br from-primary-600 via-violet-600 to-fuchsia-600 p-6 text-white shadow-lift sm:p-8; }

      .hero::before { content: ""; @apply pointer-events-none absolute -bottom-24 left-1/3 h-56 w-56 rounded-full bg-fuchsia-300/20 blur-3xl; }

      .btn { @apply inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-semibold transition-all duration-200 ease-in-out focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 active:scale-95 disabled:pointer-events-none disabled:opacity-50 dark:focus-visible:ring-offset-slate-900; }
      .btn-primary { @apply btn bg-gradient-to-r from-primary-600 to-violet-600 text-white shadow-glow hover:from-primary-500 hover:to-violet-500 hover:shadow-lg focus-visible:ring-primary-500; }
      .btn-success { @apply btn bg-emerald-600 text-white shadow-sm hover:bg-emerald-700 focus-visible:ring-emerald-500; }
      .btn-danger { @apply btn bg-rose-600 text-white shadow-sm hover:bg-rose-700 focus-visible:ring-rose-500; }
      .btn-secondary { @apply btn border border-slate-300 bg-white text-slate-700 shadow-sm hover:border-slate-400 hover:bg-slate-50 focus-visible:ring-primary-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700; }
      .btn-ghost { @apply btn text-slate-600 hover:bg-slate-100 hover:text-slate-900 focus-visible:ring-primary-500 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white; }
      .btn-icon { @apply inline-flex h-10 w-10 items-center justify-center rounded-lg text-slate-500 transition-all duration-200 ease-in-out hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 active:scale-95 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white; }
      .btn-sm { @apply px-3 py-2 text-xs; }

      /* ফর্ম */

      /* ড্রপডাউন তীর: data-URL @apply এ চলে না, তাই সাধারণ CSS */
      .form-select {

        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
        background-size: 1.25rem; background-position: right .65rem center; background-repeat: no-repeat;
      }

      /* স্ট্যাটাস ব্যাজ */
      .form-checkbox { @apply h-5 w-5 shrink-0 cursor-pointer rounded-md accent-primary-600 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500; }
      .form-file { @apply block w-full cursor-pointer rounded-lg border border-dashed border-slate-300 bg-slate-50 text-sm text-slate-600 transition-all duration-300 file:mr-4 file:cursor-pointer file:rounded-l-lg file:border-0 file:bg-primary-50 file:px-4 file:py-2.5 file:text-sm file:font-semibold file:text-primary-700 hover:border-primary-300 hover:file:bg-primary-100 dark:border-slate-700 dark:bg-slate-800/60 dark:text-slate-300 dark:file:bg-primary-500/10 dark:file:text-primary-300; }
      .form-help { @apply mt-1.5 text-xs text-slate-500 dark:text-slate-400; }
      .form-error { @apply mt-1.5 flex items-center gap-1 text-xs font-medium text-rose-600 dark:text-rose-400; }
      .has-error .form-input, .has-error .form-select, .has-error .form-file { @apply border-rose-300 ring-1 ring-rose-200 dark:border-rose-500/50 dark:ring-rose-500/20; }

      /* বিবিধ */

      .section-title { @apply flex items-center gap-2 text-sm font-semibold text-slate-900 dark:text-white; }
      .kv-label { @apply text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400; }
      .kv-value { @apply mt-0.5 text-sm font-medium text-slate-900 break-words dark:text-slate-100; }
      .page-link { @apply inline-flex h-9 min-w-[2.25rem] items-center justify-center rounded-lg border border-slate-200 bg-white px-3 text-sm font-medium text-slate-600 transition-all duration-300 hover:bg-slate-50 hover:text-slate-900 active:scale-95 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700; }
      .page-link.is-disabled { @apply pointer-events-none opacity-40; }
      .link { @apply font-medium text-primary-600 underline-offset-4 transition hover:text-primary-700 hover:underline dark:text-primary-400; }

      .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ring-inset; }
      .badge-dot { @apply h-1.5 w-1.5 rounded-full bg-current; }
      .badge-success { @apply badge bg-emerald-50 text-emerald-700 ring-emerald-600/20 dark:bg-emerald-500/10 dark:text-emerald-300 dark:ring-emerald-500/25; }
      .badge-danger { @apply badge bg-rose-50 text-rose-700 ring-rose-600/20 dark:bg-rose-500/10 dark:text-rose-300 dark:ring-rose-500/25; }
      .badge-warning { @apply badge bg-amber-50 text-amber-800 ring-amber-600/25 dark:bg-amber-500/10 dark:text-amber-300 dark:ring-amber-500/25; }
      .badge-info { @apply badge bg-blue-50 text-blue-700 ring-blue-600/20 dark:bg-blue-500/10 dark:text-blue-300 dark:ring-blue-500/25; }
      .badge-purple { @apply badge bg-violet-50 text-violet-700 ring-violet-600/20 dark:bg-violet-500/10 dark:text-violet-300 dark:ring-violet-500/25; }
      .badge-neutral { @apply badge bg-slate-50 text-slate-600 ring-slate-500/20 dark:bg-slate-700/40 dark:text-slate-300 dark:ring-slate-500/30; }

      /* টেবিল */
      /* সব তালিকার টেবিল — নতুন ডিজাইন (lx-table এর মতো): পরিষ্কার হেডার, নরম hover, ঘন কিন্তু শ্বাস নেওয়ার জায়গাসহ */
      .table-modern { @apply w-full text-left text-sm; }
      .table-modern thead th { @apply whitespace-nowrap border-b border-slate-200 bg-slate-50/90 px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500 first:pl-5 last:pr-5 dark:border-white/[0.06] dark:bg-white/[0.03] dark:text-slate-400; }

      .table-modern tbody td { @apply px-4 py-3 align-middle first:pl-5 last:pr-5; }
      .table-modern tbody tr + tr { @apply border-t border-slate-100 dark:border-white/[0.05]; }
      .table-modern .avatar { @apply rounded-xl; }

      /* ── তালিকার পেজের কিট (Attendance, Employees, Leave ...) ── */
      .lx-card { @apply overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-[0_1px_2px_rgba(15,23,42,.04),0_8px_24px_-12px_rgba(15,23,42,.08)] dark:border-white/[0.06] dark:bg-slate-900/80; }
      .lx-toolbar { @apply flex flex-col gap-3 border-b border-slate-100 px-4 py-3 sm:px-5 lg:flex-row lg:items-center lg:justify-between dark:border-white/[0.06]; }

      .lx-tab.is-on { @apply bg-slate-900 text-white hover:bg-slate-900 hover:text-white dark:bg-white dark:text-slate-900; }
      .lx-count { @apply rounded-full bg-slate-100 px-1.5 py-px text-[11px] font-bold tabular-nums text-slate-600 dark:bg-white/10 dark:text-slate-300; }

      .lx-table { @apply w-full border-separate border-spacing-0 text-left text-sm; }
      .lx-table thead th { @apply sticky top-0 z-10 whitespace-nowrap border-b border-slate-200 bg-slate-50/95 px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500 backdrop-blur first:pl-5 last:pr-5 dark:border-white/[0.06] dark:bg-slate-800/95 dark:text-slate-400; }
      .lx-table tbody td { @apply border-b border-slate-100 px-4 py-3 align-middle first:pl-5 last:pr-5 dark:border-white/[0.05]; }
      .lx-table tbody tr { @apply transition-colors duration-150; }
      .lx-table tbody tr:hover td { @apply bg-indigo-50/40 dark:bg-white/[0.02]; }
      .lx-table tr.lx-group td { @apply bg-slate-50/80 py-2 text-xs font-semibold text-slate-600 dark:bg-white/[0.03] dark:text-slate-300; }
      .lx-avatar { @apply flex h-9 w-9 shrink-0 items-center justify-center rounded-xl text-xs font-bold; }
      .lx-actions { @apply flex items-center justify-end gap-0.5 transition-opacity; }

      .lx-late { @apply lx-pill bg-amber-50 text-amber-700 ring-amber-600/20 dark:bg-amber-500/10 dark:text-amber-300 dark:ring-amber-500/20; }
      .lx-absent { @apply lx-pill bg-rose-50 text-rose-700 ring-rose-600/15 dark:bg-rose-500/10 dark:text-rose-300 dark:ring-rose-500/20; }
      .lx-leave { @apply lx-pill bg-sky-50 text-sky-700 ring-sky-600/15 dark:bg-sky-500/10 dark:text-sky-300 dark:ring-sky-500/20; }
      .lx-off { @apply lx-pill bg-slate-100 text-slate-500 ring-slate-500/10 dark:bg-white/[0.06] dark:text-slate-400 dark:ring-white/10; }
      .lx-warn { @apply lx-pill bg-orange-50 text-orange-700 ring-orange-600/20 dark:bg-orange-500/10 dark:text-orange-300 dark:ring-orange-500/20; }
      .lx-mini { @apply inline-flex items-center rounded-md px-1.5 py-0.5 text-[10.5px] font-semibold tabular-nums; }
      .lx-bar { @apply flex h-2 w-full overflow-hidden rounded-full bg-slate-100 dark:bg-white/10; }
      .lx-stat { @apply flex flex-col gap-0.5 rounded-xl px-3 py-2; }

      /* স্ট্যাট কার্ড — কোণে রঙিন আভা */
      .stat-card { @apply card relative overflow-hidden p-5 hover:-translate-y-0.5 hover:shadow-lift; }
      .stat-card::after { content: ""; @apply pointer-events-none absolute -right-10 -top-10 h-28 w-28 rounded-full bg-gradient-to-br from-primary-400/15 to-fuchsia-400/10 blur-xl; }
      .stat-icon { @apply flex h-11 w-11 items-center justify-center rounded-xl; }
      .stat-label { @apply text-[13px] font-medium text-slate-500 dark:text-slate-400; }
      .stat-value { @apply mt-1.5 text-[1.85rem] font-bold tabular-nums tracking-tight text-slate-900 dark:text-white; }

      /* লাইভ/অনলাইন বিন্দু */
      .live-dot { @apply relative inline-flex h-2.5 w-2.5 shrink-0; }
      .live-dot > span { @apply relative inline-flex h-2.5 w-2.5 rounded-full bg-emerald-500; }
      .live-dot::before { content: ""; @apply absolute inset-0 animate-pulse-ring rounded-full bg-emerald-400; }
      .off-dot { @apply inline-flex h-2.5 w-2.5 shrink-0 rounded-full bg-slate-300 dark:bg-slate-600; }

      /* সেগমেন্টেড ট্যাব */
      .tabs { @apply inline-flex rounded-xl bg-slate-100 p-1 dark:bg-white/5; }
      .tab { @apply rounded-lg px-3.5 py-1.5 text-sm font-medium text-slate-500 transition-all hover:text-slate-900 dark:hover:text-white; }
      .tab.is-active { @apply bg-white text-slate-900 shadow-sm dark:bg-slate-800 dark:text-white; }

      /* সাইডবার */
      .nav-section { @apply mb-1.5 mt-6 px-3 text-[10.5px] font-semibold uppercase tracking-[0.12em] text-slate-500/90 first:mt-0; }
      .nav-link { @apply flex w-full items-center gap-3 rounded-xl px-3 py-2 text-sm font-medium text-slate-600 transition-all duration-200 ease-in-out hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white; }
      /* সাইডবার সবসময় গাঢ় — তাই এর ভেতরের লিংক আলাদা রঙে */
      .sb .nav-link { @apply relative text-slate-400 hover:translate-x-0.5 hover:bg-white/[0.06] hover:text-white dark:hover:bg-white/[0.06]; }
      .sb .nav-link svg { @apply text-slate-500 transition-colors duration-200; }
      .sb .nav-link:hover svg { @apply text-slate-200; }
      .sb .nav-link.is-active { @apply bg-gradient-to-r from-primary-500/25 via-violet-500/15 to-transparent text-white shadow-[inset_0_0_0_1px_rgba(255,255,255,0.06)]; }
      .sb .nav-link.is-active svg { @apply text-primary-300; }
      .sb .nav-link.nav-danger, .sb .nav-link.nav-danger svg { @apply text-rose-400; }
      .sb .nav-link.nav-danger:hover { @apply bg-rose-500/10 text-rose-300; }
      .sb .nav-link.is-active::before { content: ""; @apply absolute -left-3 bottom-1.5 top-1.5 w-[3px] rounded-r-full bg-gradient-to-b from-primary-300 to-fuchsia-400; }
