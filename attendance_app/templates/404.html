<!DOCTYPE html>
<html lang="en" class="preload">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · SmartAttendance</title>
  {% include "partials/head_assets.html" %}
</head>
<body class="min-h-screen">
  <main class="flex min-h-screen items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg text-center">
      <p class="bg-gradient-to-br from-primary-500 to-violet-600 bg-clip-text text-8xl font-extrabold tracking-tight text-transparent sm:text-9xl">404</p>
      <h1 class="mt-4 text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl dark:text-white">Page not found</h1>
      <p class="mt-3 text-sm text-slate-600 sm:text-base dark:text-slate-300">মাফ করবেন — আপনি যে পেজটা খুঁজছেন সেটা পাওয়া যায়নি। লিংকটি ভুল হতে পারে, বা পেজটি সরানো হয়েছে।</p>
      <div class="mt-8 flex flex-col-reverse justify-center gap-3 sm:flex-row">
        <a href="/" onclick="if (history.length > 1) { history.back(); return false; }" class="btn-secondary">← Go back</a>
        <a href="/" class="btn-primary">{% include "partials/icon.html" with name="home" cls="h-4 w-4" %}Go to dashboard</a>
      </div>
      <p class="mt-8 text-xs text-slate-500 dark:text-slate-400">সমস্যা মনে হলে <a href="/support/" class="link">সাপোর্টে জানান</a>।</p>
    </div>
  </main>
  <script>window.addEventListener('load', function () { setTimeout(function () { document.documentElement.classList.remove('preload'); }, 150); });</script>
</body>
</html>
